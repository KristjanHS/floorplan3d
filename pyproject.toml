[project]
name = "floorplan3d"
version = "0.1.0"
description = "Scanned floor-plan PDFs to scaled 3D models via FloorplanToBlender3d"
requires-python = ">=3.12,<3.13"
dependencies = [
    "lxml>=6.1.3",
    "matplotlib>=3.11.2",
    "numpy>=2.5.5",
    "opencv-python>=5.1.0.95",
    "pillow>=13.0.0",
    "pyfiglet>=1.0.4",
    "pymupdf>=2.1",
    "pyyaml>=6.0.4",
    "scipy>=1.18.1",
]

[tool.ruff]
line-length = 120
# scripts/ modules import each other flat; mark them first-party for isort.
src = ["scripts"]
# extend-exclude, not exclude: the bare key replaces ruff's defaults (.venv, …).
# **/*.md: ruff >=0.16 formats Python code blocks inside Markdown — keep docs/rules untouched.
extend-exclude = ["vendor", "**/*.md"]

[tool.pyright]
include = ["scripts", "tests"]
exclude = ["vendor", ".venv"]
extraPaths = ["scripts", "vendor/FloorplanToBlender3d"]

[tool.pytest.ini_options]
pythonpath = ["scripts"]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
    "pyright>=1.1.414",
    "pytest>=9.2.0",
    "ruff>=0.17.6",
    "types-lxml>=2026.2.16",
]
